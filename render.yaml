services:
  - type: web
    name: vj-carreiras
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vj-carreiras-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        value: https://vj-carreiras.onrender.com
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false

databases:
  - name: vj-carreiras-db
    databaseName: vj_carreiras
    user: vj_carreiras
    plan: free
    region: ohio
    ipAllowList: []
